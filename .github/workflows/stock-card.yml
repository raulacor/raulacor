name: Update stock card

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 00:17 São Paulo time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render card
        env:
          # Uses STOCK_TOKEN if you add one (counts private contributions), else the built-in token
          GITHUB_TOKEN: ${{ secrets.STOCK_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/stock_card.py ${{ github.repository_owner }} assets/stock.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stock.svg
          git diff --cached --quiet || (git commit -m "chore: update stock card" && git push)
